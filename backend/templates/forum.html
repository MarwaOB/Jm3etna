<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        #messages-container {
            width: 50%;
            margin: 20px auto;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }
        p {
            margin: 5px 0;
            padding: 5px;
            background: #eaeaea;
            border-radius: 5px;
        }
        textarea {
            width: 50%;
            height: 60px;
            margin-top: 10px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<h2>Forum</h2>

<div id="messages-container">
    {% for msg in messages %}
    <p><strong>{{ msg.user.username }}:</strong> {{ msg.content }} <small>{{ msg.timestamp }}</small></p>
    {% endfor %}
</div>

<textarea id="message-input" placeholder="Type your message..."></textarea>
<button onclick="sendMessage()">Send</button>

<script>
    function fetchMessages() {
        fetch("{% url 'get_messages' %}")
        .then(response => response.json())
        .then(data => {
            let container = document.getElementById("messages-container");
            container.innerHTML = "";
            data.messages.forEach(msg => {
                let messageElement = document.createElement("p");
                messageElement.innerHTML = `<strong>${msg.user}:</strong> ${msg.content} <small>${msg.timestamp}</small>`;
                container.appendChild(messageElement);
            });
        });
    }

    // Fetch messages every 2 seconds
    setInterval(fetchMessages, 2000);

    function sendMessage() {
        let messageContent = document.getElementById('message-input').value;
        if (!messageContent.trim()) return;

        fetch("{% url 'send_message' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "message=" + encodeURIComponent(messageContent)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('message-input').value = "";
                fetchMessages();  // Fetch new messages immediately after sending
            }
        });
    }
</script>

</body>
</html>
