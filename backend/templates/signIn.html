<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 420px;
        }
        h2 {
            margin-bottom: 16px;
            color: #111827;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-size: 14px;
            background-color: #F9FAFB;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563EB;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #1B7F67;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #14614F;
        }
        button:active {
            transform: scale(0.98);
        }
        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Connexion</h2>
        <form action="{% url 'sign_in' %}" method="POST">
            {% csrf_token %}
            <label for="identifier">Nom d'utilisateur, Email ou Numéro</label>
            <input type="text" id="identifier" name="identifier" placeholder="Entrez votre identifiant" required>
           
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
           
            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}
           
            <button type="submit">Se connecter</button>
        </form>
    </div>

</body>
</html>
