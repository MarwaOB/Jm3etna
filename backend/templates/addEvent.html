<form action="{% url 'create_event' %}" method="POST" class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    {% csrf_token %}
    
    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Create an Event</h2>
    
    <textarea name="description" placeholder="Event Description" required
        class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300 mb-3"></textarea>
    
    <input type="text" name="eventName" placeholder="Event Name" required
        class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300 mb-3">
    
    <div class="flex space-x-2">
        <input type="date" name="dateStart" required
            class="w-1/2 p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300">
        <input type="date" name="dateEnd" required
            class="w-1/2 p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300">
    </div>

    <h3 class="text-xl font-semibold mt-6 mb-2 text-gray-700">Event Needs</h3>
    
    <div id="needs-container" class="space-y-4">
        <div class="need p-4 bg-gray-100 rounded-md shadow-sm">
            <input type="text" name="need_title" placeholder="Need Title" required
                class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300 mb-2">
            
            <textarea name="need_description" placeholder="Need Description" required
                class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300 mb-2"></textarea>

            <select name="need_type" class="need-type-selector w-full p-2 border border-gray-300 rounded-md mb-2">
                <option value="human">Human</option>
                <option value="material">Material</option>
                <option value="financial">Financial</option>
            </select>

            <div class="human-fields hidden space-y-2">
                <input type="number" name="required_people" placeholder="Required People"
                    class="w-full p-2 border border-gray-300 rounded-md">
                <select name="skill" class="w-full p-2 border border-gray-300 rounded-md">
                    <option value="">No specific skill</option>
                    {% for skill in skills %}
                    <option value="{{ skill.id }}">{{ skill.name }}</option>
                    {% endfor %}
                </select>
                <div class="flex space-x-2">
                    <input type="time" name="start_time"
                        class="w-1/2 p-2 border border-gray-300 rounded-md">
                    <input type="time" name="end_time"
                        class="w-1/2 p-2 border border-gray-300 rounded-md">
                </div>
            </div>

            <div class="material-fields hidden space-y-2">
                <input type="number" name="required_quantity" placeholder="Quantity"
                    class="w-full p-2 border border-gray-300 rounded-md">
            </div>

            <div class="financial-fields hidden">
                <input type="number" name="amount_required" step="0.01" placeholder="Amount Required"
                    class="w-full p-2 border border-gray-300 rounded-md">
            </div>
        </div>
    </div>

    <button type="button" onclick="addNeed()"
        class="mt-4 bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 transition">Add Another Need</button>
        {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}
    <button type="submit"
        class="mt-4 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition w-full">Create Event</button>
</form>

<script>
    function addNeed() {
        let needContainer = document.getElementById("needs-container");
        let newNeed = document.querySelector(".need").cloneNode(true);
        needContainer.appendChild(newNeed);
    }

    document.addEventListener("change", function(event) {
        if (event.target.classList.contains("need-type-selector")) {
            let needDiv = event.target.closest(".need");
            needDiv.querySelector(".human-fields").classList.toggle("hidden", event.target.value !== "human");
            needDiv.querySelector(".material-fields").classList.toggle("hidden", event.target.value !== "material");
            needDiv.querySelector(".financial-fields").classList.toggle("hidden", event.target.value !== "financial");
        }
    });
</script>

<style>
    .hidden {
        display: none;
    }
</style>
